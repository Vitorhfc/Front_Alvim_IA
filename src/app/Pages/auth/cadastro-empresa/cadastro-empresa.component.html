<div class="cadastro-container">
    <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
    </div>

    <form (ngSubmit)="onCadastro()" class="auth-form cadastro-form">
        <div class="form-group">
            <label for="razaoSocial">Razão Social *</label>
            <input type="text" id="razaoSocial" [(ngModel)]="empresaModel.razaoSocial" name="razaoSocial"
                placeholder="Empresa LTDA" [disabled]="loading" required autocomplete="organization">
        </div>

        <div class="form-group">
            <label for="nomeFantasia">Nome Fantasia</label>
            <input type="text" id="nomeFantasia" [(ngModel)]="empresaModel.nome" name="nome"
                placeholder="Nome comercial" [disabled]="loading" autocomplete="organization">
        </div>

        <div class="form-group">
            <label for="cnpj">CNPJ *</label>
            <input type="text" id="cnpj" [(ngModel)]="empresaModel.cnpj" name="cnpj" placeholder="00.000.000/0000-00"
                (input)="formatCNPJ($event)" maxlength="18" [disabled]="loading" required>
        </div>

        <div class="form-group">
            <label for="telefone">Telefone</label>
            <input type="text" id="telefone" [(ngModel)]="empresaModel.telefone" name="telefone"
                placeholder="(00) 00000-0000" (input)="formatTelefone($event)" maxlength="15" [disabled]="loading"
                autocomplete="tel">
        </div>

        <div class="form-group">
            <label for="emailEmpresa">E-mail Corporativo</label>
            <input type="email" id="emailEmpresa" [(ngModel)]="empresaModel.email" name="email"
                placeholder="contato@empresa.com" [disabled]="loading" autocomplete="email">
        </div>

        <button type="submit" class="btn-primary" [disabled]="loading">
            <span *ngIf="!loading">Criar Empresa</span>
            <span *ngIf="loading">Criando empresa...</span>
        </button>

        <div class="switch-form">
            <p>Deseja cancelar o cadastro?
                <a href="#" (click)="onSwitchToLogin(); $event.preventDefault()">Voltar</a>
            </p>
        </div>
    </form>
</div>
