<div class="validacao-2fa-container">
  <div class="messages">
    <div class="error-message" *ngIf="errorMessage">
      {{ errorMessage }}
    </div>
    <div class="success-message" *ngIf="successMessage">
      {{ successMessage }}
    </div>
  </div>

  <div class="content">
    <h3>Código de Verificação</h3>
    <p class="subtitle">Digite o código de 6 dígitos enviado para seu {{ getTipoValidacaoTexto }}:</p>
    <p class="destination">{{ destinoEnvio }}</p>

    <div class="digit-inputs">
      <input
        *ngFor="let digit of tokenDigits; let i = index; trackBy: trackByIndex"
        type="text"
        class="digit-input"
        [disabled]="loading"
        maxlength="1"
        (input)="onDigitInput($event, i)"
        (keydown)="onDigitKeyDown($event, i)"
        (paste)="onDigitPaste($event)"
        inputmode="numeric"
        pattern="[0-9]*"
        autocomplete="one-time-code">
    </div>

    <button
      class="btn-primary"
      (click)="confirmarValidacao()"
      [disabled]="loading || isTokenIncompleto">
      {{ tituloBotao }}
    </button>

    <div class="action-buttons">
      <!-- <button
        class="btn-link"
        (click)="onReenviarCodigo()"
        [disabled]="loading">
        Reenviar código
      </button> -->
      <button
        class="btn-link"
        (click)="onVoltarParaLogin()"
        [disabled]="loading">
        Voltar ao login
      </button>
    </div>
  </div>
</div>
