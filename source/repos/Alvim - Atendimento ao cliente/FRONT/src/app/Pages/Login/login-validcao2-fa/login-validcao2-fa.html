<div class="auth-container">
    <div class="auth-card">
        <!-- Logo/Header -->
        <div class="auth-header">
            <h1 class="auth-title">Verificação em 2 Etapas</h1>
            <p class="auth-subtitle">Confirme sua identidade para continuar</p>
        </div>

        <!-- Mensagens de Feedback -->
        <div class="messages" *ngIf="errorMessage || successMessage">
            <div class="error-message" *ngIf="errorMessage">
                {{ errorMessage }}
            </div>
            <div class="success-message" *ngIf="successMessage">
                {{ successMessage }}
            </div>
        </div>

        <!-- ETAPA 1: Seleção de Método 2FA -->
        <div class="tab-content" *ngIf="currentStep === 'select'">
            <div class="select-2fa">
                <h3>Escolha o método de verificação</h3>
                <p>Selecione como deseja receber seu código de verificação:</p>

                <div class="method-buttons">
                    <button class="method-btn" (click)="solicitarValidacao2FA(TipoValidacao.Email)"
                        [disabled]="loading">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path
                                d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z" />
                        </svg>
                        <span>E-mail</span>
                    </button>

                    <button class="method-btn" (click)="solicitarValidacao2FA(TipoValidacao.WhatsApp)"
                        [disabled]="loading">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                            <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" />
                        </svg>
                        <span>WhatsApp</span>
                    </button>
                </div>

                <button class="btn-secondary" (click)="voltarParaLogin()" [disabled]="loading">
                    Voltar para Login
                </button>
            </div>
        </div>

        <!-- ETAPA 2: Validação de Código -->
        <div class="tab-content" *ngIf="currentStep === 'validate'">
            <div class="validate-2fa">
                <h3>Código de Verificação</h3>
                <p>Digite o código de 6 dígitos enviado para:</p>
                <p class="destination">{{ destinoEnvio }}</p>

                <div class="form-group">
                    <input type="text" [(ngModel)]="token2FA" placeholder="000000" maxlength="6" class="code-input"
                        [disabled]="loading" (input)="formatToken2FA($event)" autofocus>
                </div>

                <button class="btn-primary" (click)="confirmarValidacao2FA()"
                    [disabled]="loading || token2FA.length !== 6">
                    <span *ngIf="!loading">Confirmar</span>
                    <span *ngIf="loading">Verificando...</span>
                </button>

                <button class="btn-secondary" (click)="voltarParaSelecao()" [disabled]="loading">
                    Usar outro método
                </button>
            </div>
        </div>
    </div>
</div>
